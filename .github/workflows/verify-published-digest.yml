name: Verify published daily digest
on:
  push:
    branches: [publish-verify-20261025-2b3ace6]
    paths: ['.github/workflows/verify-published-digest.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify published page hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          expected = {"2026-10-25.html":"a52ef358bd14d614ed6af2f175ddc61a7a87175021d72039b05fbc0bc0621f6e","daily/index.html":"721c772f5e427ae6a4eb9eeddaf6ee6c8498b7023accede4262ea5ccf720bb5c","index.html":"4e638722cc74e6fd9411cc053cd4f882dfa42c6240f5e6668fdce5c809aba062"}
          base = 'https://decimal2.github.io/recsys_frontier_stats/'
          results = []
          for path, sha256 in expected.items():
              url = base + path
              last_error = ''
              for attempt in range(12):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'recsys-pages-verification', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read()
                          actual = hashlib.sha256(body).hexdigest()
                          status = response.status
                      if status == 200 and actual == sha256:
                          results.append({'path': path, 'status': status, 'sha256': actual, 'bytes': len(body)})
                          print('VERIFIED ' + json.dumps(results[-1]), flush=True)
                          break
                      last_error = 'HTTP ' + str(status) + ', sha256=' + actual
                  except Exception as error:
                      last_error = str(error)
                  if attempt < 11:
                      time.sleep(10)
              else:
                  raise RuntimeError(url + ': ' + last_error)
          print('PUBLISHED_DIGEST_REPORT ' + json.dumps({'status': 'passed', 'commit': '2b3ace67805033fc608589f6a2b633146a123dad', 'pages': results}))
          PY
