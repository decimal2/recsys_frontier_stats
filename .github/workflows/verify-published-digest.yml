name: Verify published site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/verify_pages.py'
      - 'tests/test_verify_pages.py'
      - '.github/workflows/verify-published-digest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test publication verifier
        run: python3 -m unittest discover -s tests -p test_verify_pages.py -q
      - name: Verify current published snapshot
        shell: bash
        env:
          PAGES_SITE_URL: ${{ vars.PAGES_SITE_URL }}
        run: |
          set -o pipefail
          mkdir -p artifacts/pages-verify
          python3 -u scripts/verify_pages.py --site-dir docs \
            --report artifacts/pages-verify/report.json \
            2>&1 | tee artifacts/pages-verify/verify.log
      - name: Upload publication verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pages-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pages-verify/
          if-no-files-found: warn
          retention-days: 14
