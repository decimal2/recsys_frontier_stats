name: Verify published TransX
on:
  push:
    branches: [publish-verify-transx-20261028]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify live pages and every changed graphic
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          expected = {"index.html":"836953fb9884f33fe04f804c4ae9a6757407e568553c1004ad5ae461ea420a25","papers/2609.31045/assets/676d1890dd8afc30.svg":"676d1890dd8afc3091ef23b768f1c164cf49551d37b42164ccea230a26fb5b3b","papers/2609.31045/index.html":"54306ac2a4cf9752cfcdf3b37d4832b5d3c6cefae1063b54b2080332e5c78974","papers/2610.20913/assets/087bad68549f9632.png":"5f58c61c7c20e4334252dfc6d643240823b3199caf0504f689216deffffc4779","papers/2610.20913/assets/15a2650f9a801977.png":"7d36ab11552e2b1d05d6c3f45905cf2c44a196894c0f1106e3953b3471292f2a","papers/2610.20913/assets/3949e6977ab4b511.png":"c78fa04980508c947f1bf0ff26a9c2e9594eb1ad50d066efa8df037211e2c2d1","papers/2610.20913/assets/6b848af7561c59e9.png":"954eec58acf2fd9755f68fae365731d542820a1f237856f2364ffec1182a2295","papers/2610.20913/assets/839568643c22fb40.png":"abf9721696ce70684f7f433ad43d0da814842bd3203ed78b69726c29abb5f800","papers/2610.20913/assets/9d50a9273da2a67e.png":"d54651b4d74d487a773de93c99e082299a0d8e8d12439a5bf0e78356f972cf22","papers/2610.20913/assets/b8871f29f91c5958.png":"a2040149ac7fdb99296baf90c05cfa10911f69811958991d07e759cf6928dd16","papers/2610.20913/assets/ca24cbfc3bf0decc.png":"77e507a73e9f6c33c51ba6d20a1c17943cfad6d3e978ce0f733611c33f2f17fc","papers/2610.20913/assets/df26dc0d303f5caf.png":"36aa3cf47043e80758f1ca396c18ba671203b28cc55c1bc541d2f1b1f40675ae","papers/2610.20913/assets/e088903942fd014b.png":"d9942d5d4887764668f5ceec64a7cb2fbc025458bd49829a7e8eb6b8511746e9","papers/2610.20913/assets/f15f40ccf34f4bb8.png":"d90dd5b6d812ebac73497f8d04e75b15c411b080c874135508390dd8f26f807d","papers/2610.20913/index.html":"0a6a33bdb4f6b5577231e344379d4bad8e49310bd0aadc250443461d17661a94","papers/catalog.json":"e80f83fc5c3814647c47a9f7e7ce2898cce3b6fd7b7a740a2469d96e3696bc9c","papers/index.html":"9274268d1022484f4c40f9e518fb6f63de9388bfffcbdece3227345bade83a33"}
          results = []
          for path, wanted in expected.items():
              url = 'https://decimal2.github.io/recsys_frontier_stats/' + path
              last_error = ''
              for attempt in range(24):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'recsys-publication-verification', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read()
                          actual = hashlib.sha256(body).hexdigest()
                          status = response.status
                      if status == 200 and actual == wanted:
                          results.append({'path': path, 'status': status, 'sha256': actual})
                          print('VERIFIED ' + json.dumps(results[-1]), flush=True)
                          break
                      last_error = 'HTTP ' + str(status) + ', sha256=' + actual
                  except Exception as error:
                      last_error = str(error)
                  if attempt < 23:
                      time.sleep(10)
              else:
                  raise RuntimeError(url + ': ' + last_error)
          print('LIVE_REPORT ' + json.dumps({'status': 'passed', 'commit': 'dbb3c11af5f8adf1186a59848c071210604f9748', 'files': results}))
          PY
