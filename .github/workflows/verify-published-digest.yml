name: Verify published daily digest
on:
  push:
    branches: [publish-verify-20261025-2b3ace6]
    paths: ['.github/workflows/verify-published-digest.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify published October 26 pages
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          expected = {"2026-10-26.html":"4d5d21ffcf4fb83bf08ba13b8cbad0f0ce2cb0cb279a1be0c1fc5f0df1c575b7","daily/index.html":"ea68a3cffa48a854234afea8efb7602ebf53a02cb9a795ff27fc6f992f19c037","index.html":"25d1c0619e598c6cae8f2442142b5a95c2527cab74d75d56e9eb92c97ffe7971"}
          forbidden = ['最低要求', '继续补齐', 'insufficient', '基于提取到的全文文字生成；图片未做视觉分析。']
          results = []
          for path, sha256 in expected.items():
              url = 'https://decimal2.github.io/recsys_frontier_stats/' + path
              last_error = ''
              for attempt in range(12):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'recsys-pages-verification', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read()
                          actual = hashlib.sha256(body).hexdigest()
                          status = response.status
                      if status == 200 and actual == sha256:
                          assert all(text not in body.decode('utf-8') for text in forbidden)
                          results.append({'path': path, 'status': status, 'sha256': actual, 'shortfall_notice_absent': True})
                          print('VERIFIED ' + json.dumps(results[-1]), flush=True)
                          break
                      last_error = 'HTTP ' + str(status) + ', sha256=' + actual
                  except Exception as error:
                      last_error = str(error)
                  if attempt < 11: time.sleep(10)
              else:
                  raise RuntimeError(url + ': ' + last_error)
          print('PUBLISHED_DIGEST_REPORT ' + json.dumps({'status': 'passed', 'commit': 'c6c5858f5e9a805c70b5dbb693bb171dc9854e50', 'pages': results}))
          PY
